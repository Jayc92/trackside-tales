name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_REMOTE_TALES: 'true'
          VITE_USE_REMOTE_BEERS: 'true'
          VITE_USE_REMOTE_FOOD: 'true'
          VITE_USE_REMOTE_REWARDS: 'false'
          # PUBLIC-v7.4B.P.13b: production QR validation is
          # server-authoritative via the validate-qr Edge Function.
          # With this flag on, the local demo allowlist can never run
          # in production and validator failures fail closed (no
          # unlock). Scanning will not unlock anything until the
          # operator deploys validate-qr (see README "QR validation").
          VITE_USE_REMOTE_QR_VALIDATION: 'true'

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
